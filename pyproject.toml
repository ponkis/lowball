[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowball"
dynamic = ["version"]
description = "A physics-based cursor accessory (ball and chain) for Windows"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "ponkis" }]
keywords = ["pygame", "numpy", "cursor", "chain", "physics", "overlay", "windows", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.20.0",
    "pywin32>=300",
]

[project.urls]
Homepage = "https://github.com/ponkis/lowball"
Repository = "https://github.com/ponkis/lowball"
Issues = "https://github.com/ponkis/lowball/issues"

[project.scripts]
lowball = "lowball.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "lowball.__version__" }

[tool.setuptools.package-data]
lowball = ["assets/*.mp3"]
