[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lowball"
version = "1.0.0"
description = "A physics-based cursor accessory (ball and chain) for Windows"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "ponkis" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.20.0",
    "pywin32>=300",
]

[project.urls]
Homepage = "https://github.com/ponkis/lowball"

[project.scripts]
lowball = "lowball.main:main"
